# Marcos's AI Assistant: Cloudflare Worker (free plan) + D1 database + Workers AI
name = "marcos-assistant"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# The dashboard's page, styles and script are bundled as text
[[rules]]
type = "Text"
globs = ["**/admin-ui/*.html", "**/admin-ui/*.css", "**/admin-ui/*.client.js"]
fallthrough = false

[[d1_databases]]
binding = "DB"
database_name = "assistant"
database_id = "3108a2a2-8fcf-4572-bc66-f4d0df6ced94" # created with --jurisdiction eu
migrations_dir = "migrations"

[ai]
binding = "AI"

# Per-visitor limits (keyed by a daily-salted hash of the IP address, never stored). These are
# approximate; strict counts are also kept in the database (limits table, see underLimits)
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1001"
simple = { limit = 8, period = 60 }

[[ratelimits]]
name = "EVENT_LIMIT"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

# Nightly clean-up: retention limits and expired sessions
[triggers]
crons = ["17 3 * * *"]

[vars]
SITE_ORIGIN = "https://marcosgalarraga122-debug.github.io"
SITE_URL = "https://marcosgalarraga122-debug.github.io/web-portfolio/"
MODEL = "@cf/mistralai/mistral-small-3.1-24b-instruct"   # chosen after comparing 4 free models on EN/ES/FR conversations
AI_DAILY_LIMIT = "130"                 # model replies per day; ≈ what the 10,000 free neurons/day cover with this model
MAX_MESSAGES_PER_CONVERSATION = "30"   # visitor messages per conversation
CHAT_PER_VISITOR_PER_DAY = "40"        # chat messages per visitor per day (keeps one visitor from using the day's AI budget)
CONVERSATION_RETENTION_DAYS = "90"
ANALYTICS_RETENTION_DAYS = "365"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   ADMIN_PASSWORD  the dashboard password (at least 12 characters)
#   HASH_SECRET     optional: key for hashes (rate limiting, password comparison); if unset the
#                   Worker generates one and keeps it in its database (settings table)
